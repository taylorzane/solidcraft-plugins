name: Plugins

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*-v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Build and test
    if: ${{ !github.event.deleted }}
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      archive: ${{ steps.release.outputs.archive }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Match release tag to plugin
        id: release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          shopt -s nullglob
          for manifest in */packaging/plugin.json; do
            plugin=${manifest%/packaging/plugin.json}
            version=$(jq -er --arg id "$plugin" 'select(.id == $id) | .version | strings' "$manifest")
            if [[ "$GITHUB_REF_NAME" == "$plugin-v$version" ]]; then
              printf 'task=test:%s\narchive=%s-%s.zip\nversion=%s\n' \
                "$plugin" "$plugin" "$version" "$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          printf 'Tag %s must match <plugin-id>-v<version> from a plugin manifest\n' "$GITHUB_REF_NAME" >&2
          exit 1

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: '2026.11.8'

      - name: Install SolidCraft CLI
        env:
          CLI_VERSION: '0.47.0'
          CLI_SHA256: 6b0a3419e313f45faf7cb4b644c9af6652bb66929e7bec67ccb105e81b2f4758
        run: |
          bundle="solidcraft-cli-$CLI_VERSION-macos-universal"
          archive="$RUNNER_TEMP/$bundle.zip"
          cli="$RUNNER_TEMP/$bundle/solidcraft-cli"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/tangency-labs/solidcraft/releases/download/v$CLI_VERSION/$bundle.zip" \
            --output "$archive"
          printf '%s  %s\n' "$CLI_SHA256" "$archive" | shasum -a 256 -c
          unzip -q "$archive" "$bundle/solidcraft-cli" -d "$RUNNER_TEMP"
          "$cli" --version
          printf 'SOLIDCRAFT_CLI=%s\n' "$cli" >> "$GITHUB_ENV"

      - name: Run mise tests
        env:
          MISE_TASK: ${{ steps.release.outputs.task || 'test' }}
        run: mise run "$MISE_TASK"

      - name: Upload plugin ZIPs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-zips
          path: dist/${{ steps.release.outputs.archive || '*.zip' }}
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency: plugin-release-${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-zips
          path: dist

      - name: Publish tested ZIP
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: ${{ needs.test.outputs.archive }}
          RELEASE_VERSION: ${{ needs.test.outputs.version }}
        run: |
          archive="dist/$RELEASE_ASSET"
          if ! unzip -p "$archive" plugin.json | jq -e --arg tag "$GITHUB_REF_NAME" \
            '(.id + "-v" + .version) == $tag' > /dev/null; then
            printf 'Archive %s does not contain the plugin for tag %s\n' "$archive" "$GITHUB_REF_NAME" >&2
            exit 1
          fi

          if release=$(gh release view "$GITHUB_REF_NAME" --json assets,isDraft 2>/dev/null); then
            if ! jq -e --arg asset "$RELEASE_ASSET" \
              'any(.assets[]; .name == $asset and .state == "uploaded")' \
              <<< "$release" > /dev/null; then
              gh release upload "$GITHUB_REF_NAME" "$archive"
            fi
            if jq -e '.isDraft' <<< "$release" > /dev/null; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
            fi
          else
            flags=(--verify-tag --generate-notes)
            if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "$archive" "${flags[@]}"
          fi
