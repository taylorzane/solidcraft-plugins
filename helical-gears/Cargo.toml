[package]
name = "solidcraft-helical-gears"
version = "0.47.1"
edition = "2024"
license = "BSD-3-Clause AND MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true
