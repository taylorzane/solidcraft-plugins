[tools]
bun = "1.4.4"
rust = { version = "1.99.1", profile = "minimal", targets = ["wasm32-unknown-unknown"], components = ["rustfmt", "clippy"] }
"cargo:wasm-tools" = { version = "1.263.0", default-features = false, features = ["component"] }

[task_config]
includes = ["*/tasks.toml"]

[tasks.build]
description = "Build every plugin ZIP"
run = "bun scripts/release.js build"

[tasks.test]
description = "Build and test every plugin"
run = "bun scripts/release.js test"

[tasks.licenses]
description = "Refresh plugin third-party notices"
depends = ["licenses:*"]
